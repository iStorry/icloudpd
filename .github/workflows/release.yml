# Tags a version and publishes it as a GitHub Release with the app attached.
#
# Two ways to start it:
#   - Actions > Release > Run workflow, and type a version like 1.2.0 (or 1.2.0-beta.1). The commit
#     the run is on gets the tag v1.2.0 once the tests and the build pass.
#   - Push a tag yourself: git tag v1.2.0 && git push origin v1.2.0
#
# A version with a suffix (1.2.0-beta.1) is published as a pre-release. A tag this workflow pushes
# with its own token does not start the workflow a second time.
#
# With these repository secrets set, the app and command-line tool are signed with Developer ID and
# notarized by Apple, so they open without a warning (README > Notarizing):
#   DEVELOPER_ID_P12           the "Developer ID Application" certificate and key, as base64 .p12
#   DEVELOPER_ID_P12_PASSWORD  the password the .p12 was exported with
#   NOTARY_API_KEY             an App Store Connect API key, the contents of AuthKey_XXXX.p8
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID shown above the keys in App Store Connect
# Without them the release is built with an ad-hoc signature and its notes explain Open Anyway.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.0 or 1.2.0-beta.1 (tagged v1.2.0)"
        required: true
        type: string

# One release at a time, and never cut one short.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    # The package needs the macOS 26 SDK (Xcode 26 or later).
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::\"$VERSION\" isn't a version like 1.2.0 or 1.2.0-beta.1."
            exit 1
          fi
          TAG="v$VERSION"
          if [ "$EVENT" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Pick a new version, or delete the old tag first."
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (pre-release: $PRERELEASE)"
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::No Developer ID secrets, so $TAG won't be notarized. See README > Notarizing."
          fi

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Load the signing certificate
        id: signing
        if: env.SIGNED == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # A keychain of its own for this run, removed at the end.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::DEVELOPER_ID_P12 has no \"Developer ID Application\" certificate with its private key."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build the app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        run: scripts/build-app.sh

      - name: Notarize
        if: env.SIGNED == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$NOTARY_API_KEY" > "$NOTARY_KEY_PATH"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          scripts/notarize.sh

      - name: Package
        working-directory: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ditto -c -k --keepParent "iCloud Photos Downloader.app" "iCloud-Photos-Downloader-$VERSION.zip"
          ditto -c -k --norsrc --noextattr icloudpd-swift "icloudpd-swift-$VERSION-macos.zip"
          shasum -a 256 "iCloud-Photos-Downloader-$VERSION.zip" "icloudpd-swift-$VERSION-macos.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Tag this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "iCloud Photos Downloader ${TAG#v}"
          git push origin "$TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FILES=(
            "build/iCloud-Photos-Downloader-$VERSION.zip"
            "build/icloudpd-swift-$VERSION-macos.zip"
            "build/SHA256SUMS.txt"
          )
          if [ "$SIGNED" = "true" ]; then
            OPEN_STEP="2. Open it. It's signed and notarized by Apple, so it opens like any other app."
          else
            OPEN_STEP="2. The app isn't notarized by Apple yet. The first time you open it, macOS stops it: go to **System Settings › Privacy & Security** and click **Open Anyway**."
          fi
          cat > build/NOTES.md <<NOTES
          ## Install

          1. Download **iCloud-Photos-Downloader-$VERSION.zip**, open it, and drag **iCloud Photos Downloader** to Applications.
          $OPEN_STEP

          Needs macOS 26 Tahoe or later. The command-line tool is in **icloudpd-swift-$VERSION-macos.zip**.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running the workflow for a tag that already has a release: replace its files.
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            FLAGS=(--title "iCloud Photos Downloader $VERSION" --notes-file build/NOTES.md --generate-notes --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "${FILES[@]}" "${FLAGS[@]}"
          fi

      - name: Remove the signing keychain
        if: always() && steps.signing.outcome != 'skipped'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
